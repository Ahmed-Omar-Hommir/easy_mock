name: easy_mock_local_notifications
description: >-
  Makes flutter_local_notifications work under `flutter test`.
  mockLocalNotifications.init() registers the real Android platform impl (the
  native registrant that normally does this doesn't run in tests, so the plugin
  throws a LateInitializationError) and stubs its `dexterous.com/flutter/
  local_notifications` MethodChannel via easy_mock_channel — real Dart, no native.
version: 0.1.0
homepage: https://github.com/Ahmed-Omar-Hommir/easy_mock
repository: https://github.com/Ahmed-Omar-Hommir/easy_mock
issue_tracker: https://github.com/Ahmed-Omar-Hommir/easy_mock/issues

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.0.0
  easy_mock_channel: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  easy_mock_channel:
    path: ../../easy_mock_channel
