name: easy_mock_firebase
description: >-
  Firebase test fakes for Flutter widget tests. Stubs the Performance, Messaging,
  App Check and Crashlytics platform channels and installs an in-memory Remote
  Config (setRemoteValues / pushUpdate), so each plugin runs its real Dart
  without reaching native. HttpMetric calls settle under the fake clock and App
  Check no longer hangs it.
version: 0.1.0
homepage: https://github.com/Ahmed-Omar-Hommir/easy_mock
repository: https://github.com/Ahmed-Omar-Hommir/easy_mock
issue_tracker: https://github.com/Ahmed-Omar-Hommir/easy_mock/issues

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  firebase_core: ^4.13.0
  firebase_core_platform_interface: ^8.1.0
  firebase_remote_config_platform_interface: ^3.0.3
  easy_mock_channel: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  # Pinned to the app's known-good versions.
  firebase_messaging: 16.5.0
  firebase_crashlytics: 5.2.7
  firebase_app_check: 0.4.6
