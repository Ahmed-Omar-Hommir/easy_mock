name: easy_mock_secure_storage
description: >-
  Readable test mock for flutter_secure_storage. Backs the plugin's method
  channel with an in-memory store you can seed and read back, with no dependency
  on flutter_secure_storage — it speaks the channel's raw method codes.
version: 0.1.0
homepage: https://github.com/Ahmed-Omar-Hommir/easy_mock
repository: https://github.com/Ahmed-Omar-Hommir/easy_mock
issue_tracker: https://github.com/Ahmed-Omar-Hommir/easy_mock/issues

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
