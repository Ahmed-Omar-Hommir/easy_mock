name: easy_mock_channel
description: >-
  Fluent MethodChannel mocking for Flutter tests. Stub platform-channel calls
  with when, match arguments by deep equality, and assert with verify — the
  mock handler installs immediately and is removed on teardown.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
