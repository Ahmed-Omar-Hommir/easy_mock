name: easy_mock_channel
description: >-
  Fluent MethodChannel mocking for Flutter tests. Stub platform-channel calls
  with when, match arguments by deep equality, and assert with verify — the
  mock handler installs immediately and is removed on teardown. Also ships a
  guard that fails a test when the app calls an unmocked platform channel,
  naming the channel, method, and call site instead of hanging.
version: 0.1.1
homepage: https://github.com/Ahmed-Omar-Hommir/easy_mock
repository: https://github.com/Ahmed-Omar-Hommir/easy_mock
issue_tracker: https://github.com/Ahmed-Omar-Hommir/easy_mock/issues

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  stack_trace: ^1.12.1

dev_dependencies:
  flutter_lints: ^6.0.0
