name: easy_mock_firebase
description: >-
  Firebase test fakes for Flutter widget tests. mockFirebasePerformance.install()
  stubs the Firebase Performance pigeon channel so HttpMetric calls settle under
  the fake clock; mockRemoteConfig.install() installs an in-memory
  FirebaseRemoteConfigPlatform (setRemoteValues / pushUpdate) while keeping the
  real Remote Config Dart logic;
  mockFirebaseMessaging.install() / mockFirebaseAppCheck.install() /
  mockFirebaseCrashlytics.install() stub the respective MethodChannel / pigeon
  channels so those plugins run their real Dart without reaching native (App
  Check no longer hangs the fake clock, Crashlytics never hits the channel).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  firebase_core: ^4.6.0
  firebase_core_platform_interface: ^7.0.1
  firebase_remote_config_platform_interface: ^3.0.3
  easy_mock_channel:
    path: ../easy_mock_channel

dev_dependencies:
  flutter_lints: ^6.0.0
  # Pinned to the app's known-good versions: newer majors need firebase_core 5.x.
  firebase_messaging: 16.2.2
  firebase_crashlytics: 5.2.3
  firebase_app_check: 0.4.4+1
